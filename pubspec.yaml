name: iclass
description: 校园课表与智能课前提醒
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^22.0.1
  tray_manager: 0.5.3
  window_manager: ^0.5.2
  launch_at_startup: ^0.5.1
  excel_plus: ^2.12.4
  audioplayers: ^6.8.1
  path_provider: ^2.1.5
  file_selector: ^1.0.3
  intl: ^0.20.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/reminder.wav
    - assets/icons/tray.ico
